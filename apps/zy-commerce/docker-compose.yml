# Local development database for ZY Commerce.
#   docker compose up -d        # start
#   docker compose down         # stop (data kept in the named volume)
#   docker compose down -v      # stop and wipe data
#
# Creates two databases: zy_commerce (dev) and zy_commerce_test (integration tests).
name: zy-commerce

services:
  db:
    image: postgres:17-alpine
    container_name: zy-commerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zy
      POSTGRES_PASSWORD: zy
      POSTGRES_DB: zy_commerce
    ports:
      - "5432:5432"
    volumes:
      - zy_commerce_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zy -d zy_commerce"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zy_commerce_pgdata:
